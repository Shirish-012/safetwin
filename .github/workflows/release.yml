# A release: pushing a tag v<version> (the version in pyproject.toml) builds the sdist and the wheel, runs
# the README's quickstart on the wheel, publishes both to PyPI, and pushes the container image to the GitHub
# Container Registry as ghcr.io/<owner>/<repository>:<version> and :latest.
#
# PyPI publishing uses trusted publishing (OIDC): no token is stored. Before the first release, add this
# repository, the workflow file release.yml and the environment "pypi" as a trusted publisher of the project
# on pypi.org.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and try the packages
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: The tag is the version in pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$TAG" = "v$version" || { echo "tag $TAG is not v$version"; exit 1; }

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --quiet build
          python -m build

      - name: Run the README's quickstart on a fresh install
        run: PYTHON=python scripts/smoke.sh

      - name: Keep the packages for the next jobs
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    name: Push the container image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build, try and push the image
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker build -t "$image:${TAG#v}" -t "$image:latest" .
          docker run --rm "$image:${TAG#v}" --version
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$image:${TAG#v}"
          docker push "$image:latest"
